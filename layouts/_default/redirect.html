{{ define "main" }}
<article>
    <div class="article-header">
        <h1>{{ .Title }}</h1>
        <div class="article-date">{{ .Date.Format "January 2, 2006" }}</div>
    </div>
    <section class="article-content">
        <p>{{ .Description }}</p>
        <p><a href="{{ .Params.target }}">Read the book →</a></p>
    </section>
</article>
<script>location.replace({{ .Params.target }});</script>
{{ end }}
